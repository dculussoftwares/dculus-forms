name: Fetch frontend build
description: >
  Downloads the already-built dist of one frontend app: from the GitHub Release assets for
  a vX.Y.Z tag, or from the current Build Pipeline run's artifacts for a sha-<commit> tag.

inputs:
  app:
    description: form-app, form-viewer or admin-app
    required: true
  release_tag:
    description: vX.Y.Z or sha-<40 hex>
    required: true
  output_dir:
    description: Directory that receives the app's dist contents
    required: true
  github_token:
    description: Token with contents:read
    required: true

runs:
  using: composite
  steps:
    - name: Download dist from this run's artifacts
      if: startsWith(inputs.release_tag, 'sha-')
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.app }}-dist-${{ substring(inputs.release_tag, 4, 40) }}
        path: ${{ inputs.output_dir }}

    - name: Download dist from the release assets
      if: startsWith(inputs.release_tag, 'v')
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        APP: ${{ inputs.app }}
        TAG: ${{ inputs.release_tag }}
        OUT: ${{ inputs.output_dir }}
      run: |
        set -euo pipefail
        [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "❌ Invalid release tag '$TAG'"; exit 1; }
        mkdir -p "$OUT"
        tmp=$(mktemp -d)
        gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "${APP}-build-${TAG}.zip" --dir "$tmp"
        unzip -q "$tmp/${APP}-build-${TAG}.zip" -d "$tmp/unzipped"
        cp -R "$tmp/unzipped/dist/." "$OUT/"

    - name: Verify the build is runtime-configurable
      shell: bash
      env:
        OUT: ${{ inputs.output_dir }}
        APP: ${{ inputs.app }}
        TAG: ${{ inputs.release_tag }}
      run: |
        set -euo pipefail
        # Builds that predate runtime config bake in URLs and would silently point at the wrong backend.
        if [ ! -f "$OUT/index.html" ] || ! grep -q '/config.js' "$OUT/index.html"; then
          echo "❌ ${APP} build for ${TAG} does not load /config.js (built before runtime config existed?)"
          exit 1
        fi
        echo "✅ Fetched ${APP} build for ${TAG}"
