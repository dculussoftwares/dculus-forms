name: Fetch frontend build
description: >
  Downloads the already-built dist of one frontend app: from the GitHub Release assets for
  a vX.Y.Z tag, or from the Build Pipeline artifacts for a sha-<commit> tag.

inputs:
  app:
    description: form-app, form-viewer or admin-app
    required: true
  release_tag:
    description: vX.Y.Z or sha-<40 hex>
    required: true
  output_dir:
    description: Directory that receives the app's dist contents
    required: true
  github_token:
    description: Token with contents:read and actions:read
    required: true

runs:
  using: composite
  steps:
    - name: Download dist
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        APP: ${{ inputs.app }}
        TAG: ${{ inputs.release_tag }}
        OUT: ${{ inputs.output_dir }}
      run: |
        set -euo pipefail
        mkdir -p "$OUT"
        tmp=$(mktemp -d)

        if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "${APP}-build-${TAG}.zip" --dir "$tmp"
          unzip -q "$tmp/${APP}-build-${TAG}.zip" -d "$tmp/unzipped"
          cp -R "$tmp/unzipped/dist/." "$OUT/"
        elif [[ "$TAG" =~ ^sha-([0-9a-f]{40})$ ]]; then
          SHA="${BASH_REMATCH[1]}"
          # The calling Build Pipeline run (deploy-dev) still has the artifact in this run; otherwise find the run for the commit.
          if ! gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" -n "${APP}-dist-${SHA}" -D "$OUT" 2>/dev/null; then
            RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml --branch main --event push \
              --status success --commit "$SHA" --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$RUN_ID" ] || { echo "❌ No successful Build Pipeline run found for $SHA"; exit 1; }
            gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -n "${APP}-dist-${SHA}" -D "$OUT"
          fi
        else
          echo "❌ Unsupported release tag '$TAG'"
          exit 1
        fi

        [ -f "$OUT/index.html" ] || { echo "❌ No index.html in downloaded ${APP} build"; exit 1; }
        echo "✅ Fetched ${APP} build for ${TAG}"
