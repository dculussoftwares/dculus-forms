name: Release

# Promotes a commit that is already verified on dev to production:
#   prepare (validate + next version) -> approve (once) -> publish (retag image, tag, GitHub Release) -> deploy
# No rebuild: the production backend runs the same image dev ran (sha-<commit> retagged vX.Y.Z).

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump: patch = fixes, minor = new features, major = breaking"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      source_sha:
        description: "Commit to release (default: latest main commit with a green Build Pipeline + dev deploy)"
        required: false
        type: string
        default: ""
      dry_run:
        description: "Only print the computed version and plan"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: dculus/forms-backend

jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      previous: ${{ steps.plan.outputs.previous }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
    steps:
      - name: Require main branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "❌ Releases can only be started from main (got $GITHUB_REF)"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate source commit and compute version
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail

          if [ -n "$INPUT_SOURCE_SHA" ]; then
            if [[ ! "$INPUT_SOURCE_SHA" =~ ^[0-9a-f]{7,40}$ ]]; then
              echo "❌ source_sha must be a hex commit SHA"
              exit 1
            fi
            SRC=$(git rev-parse --verify "${INPUT_SOURCE_SHA}^{commit}")
          else
            SRC=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml --branch main \
              --event push --status success --limit 1 --json headSha --jq '.[0].headSha // empty')
            if [ -z "$SRC" ]; then
              echo "❌ No successful Build Pipeline run found on main"
              exit 1
            fi
          fi

          if ! git merge-base --is-ancestor "$SRC" HEAD; then
            echo "❌ $SRC is not an ancestor of main"
            exit 1
          fi

          GREEN=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml --branch main \
            --event push --status success --commit "$SRC" --limit 1 --json databaseId --jq 'length')
          if [ "$GREEN" = "0" ]; then
            echo "❌ No successful Build Pipeline (build + dev deploy) run for $SRC"
            exit 1
          fi

          if ! docker manifest inspect "${IMAGE}:sha-${SRC}" > /dev/null 2>&1; then
            echo "❌ Image ${IMAGE}:sha-${SRC} not found on Docker Hub"
            exit 1
          fi

          ALREADY=$(git tag --points-at "$SRC" --list 'v[0-9]*.[0-9]*.[0-9]*' | head -n1)
          if [ -n "$ALREADY" ]; then
            echo "❌ $SRC is already released as $ALREADY (use the Multi-Cloud Deployment workflow to redeploy a tag)"
            exit 1
          fi

          PREV=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          PREV=${PREV:-v0.0.0}
          IFS=. read -r MAJOR MINOR PATCH <<< "${PREV#v}"
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
            *) echo "❌ Unknown bump '$BUMP'"; exit 1 ;;
          esac
          NEXT="v${MAJOR}.${MINOR}.${PATCH}"

          if git rev-parse -q --verify "refs/tags/${NEXT}" > /dev/null; then
            echo "❌ Tag ${NEXT} already exists"
            exit 1
          fi

          {
            echo "version=${NEXT}"
            echo "previous=${PREV}"
            echo "source_sha=${SRC}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Release plan"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`${PREV}\` → **\`${NEXT}\`** (${BUMP}) |"
            echo "| Commit | \`${SRC}\` |"
            echo "| Image | \`${IMAGE}:sha-${SRC}\` → \`${IMAGE}:${NEXT}\` |"
            echo "| Dry run | ${{ inputs.dry_run }} |"
            echo ""
            echo "### Changes since ${PREV}"
            git log --oneline "${PREV}..${SRC}" 2>/dev/null | head -50 || true
          } >> "$GITHUB_STEP_SUMMARY"

  approve:
    name: Approve Production Release
    needs: prepare
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Reviewers are configured on this environment; the deploy workflow is told
    # `approved: true` so they are not prompted a second time.
    environment: production-approval
    steps:
      - name: Approved
        run: echo "✅ ${{ needs.prepare.outputs.version }} (${{ needs.prepare.outputs.source_sha }}) approved for production"

  publish:
    name: Publish Image Tags and GitHub Release
    needs: [prepare, approve]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Retag image (no rebuild)
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SRC: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail
          MAJOR="${VERSION%%.*}"
          MAJOR_MINOR="${VERSION%.*}"
          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:${MAJOR_MINOR}" \
            -t "${IMAGE}:${MAJOR}" \
            "${IMAGE}:sha-${SRC}"

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PREVIOUS: ${{ needs.prepare.outputs.previous }}
          SRC: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail
          ARGS=(--repo "$GITHUB_REPOSITORY" --target "$SRC" --title "Release ${VERSION}" --generate-notes)
          if [ "$PREVIOUS" != "v0.0.0" ]; then
            ARGS+=(--notes-start-tag "$PREVIOUS")
          fi
          gh release create "$VERSION" "${ARGS[@]}" \
            --notes "Backend image: \`${IMAGE}:${VERSION}\` (promoted from the build verified on dev)."

  # Self-hosting archives documented in docs/deployment/DEPLOYMENT_GUIDE.md. Not used by
  # the production deploy, so a failure here does not block or roll back it.
  package-assets:
    name: Attach Self-Hosting Archives
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      BACKEND_URL: https://dculus-forms-backend.reddune-e5ba9473.eastus.azurecontainerapps.io
      FORM_VIEWER_URL: https://dculus-forms-viewer-app.pages.dev
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          node-version: '22.14.0'
          run-prisma-generate: 'true'

      - name: Build packages, backend and frontends
        env:
          VITE_CDN_ENDPOINT: ${{ secrets.VITE_CDN_ENDPOINT }}
          VITE_PIXABAY_API_KEY: ${{ secrets.VITE_PIXABAY_API_KEY }}
          VITE_API_URL: ${{ env.BACKEND_URL }}
          VITE_GRAPHQL_URL: ${{ env.BACKEND_URL }}/graphql
          VITE_FORM_VIEWER_URL: ${{ env.FORM_VIEWER_URL }}
        run: |
          set -euo pipefail
          pnpm --filter @dculus/types build
          pnpm --filter @dculus/utils build
          pnpm --filter @dculus/ui build
          pnpm --filter backend build
          pnpm --filter form-app build
          pnpm --filter form-viewer build
          pnpm --filter admin-app build

      - name: Create archives
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir backend-release
          cp -r apps/backend/dist apps/backend/prisma backend-release/
          cp apps/backend/package.json apps/backend/.env.example apps/backend/README-DEPLOYMENT.md backend-release/
          (cd apps/backend && pnpm install --prod --frozen-lockfile)
          cp -r apps/backend/node_modules backend-release/
          (cd backend-release && zip -qr "../backend-build-${VERSION}.zip" .)
          for app in form-app form-viewer admin-app; do
            (cd "apps/${app}" && zip -qr "../../${app}-build-${VERSION}.zip" dist/)
          done
          ls -lh ./*.zip

      - name: Upload archives to the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: gh release upload "$VERSION" ./*-build-"${VERSION}".zip --repo "$GITHUB_REPOSITORY"

  deploy:
    name: Deploy to Production
    needs: [prepare, publish]
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/multi-cloud-deployment.yml
    secrets: inherit
    with:
      environment: production
      release_tag: ${{ needs.prepare.outputs.version }}
      release_commit: ${{ needs.prepare.outputs.source_sha }}
      approved: true
