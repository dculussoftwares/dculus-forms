# Publishes @dculus/form-renderer to npm (used by dculus.com template pages).
#
# Run it manually, or push a tag `form-renderer-v<version>` matching
# packages/form-renderer/package.json. Needs the NPM_TOKEN repo secret
# (an npm automation token with publish rights on the @dculus scope).
name: Publish form-renderer

on:
  workflow_dispatch:
  push:
    tags:
      - 'form-renderer-v*'

permissions:
  contents: read
  id-token: write # npm provenance

concurrency:
  group: publish-form-renderer
  cancel-in-progress: false

env:
  NODE_VERSION: '22.14.0'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./packages/form-renderer/package.json').version")
          if [ "${GITHUB_REF_NAME}" != "form-renderer-v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}" >&2
            exit 1
          fi

      - name: Test and build
        run: |
          pnpm --filter @dculus/form-renderer test
          pnpm --filter @dculus/form-renderer type-check
          pnpm --filter @dculus/form-renderer build

      - name: Publish
        working-directory: packages/form-renderer
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          pnpm publish --access public --no-git-checks --provenance
