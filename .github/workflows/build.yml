name: Build Pipeline

on:
  push:
    branches: [ main, develop, release ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'infrastructure/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'infrastructure/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  id-token: write
  contents: write
  packages: write

env:
  NODE_VERSION: '22.14.0'
  REGISTRY: docker.io
  IMAGE_NAME: dculus/forms-backend
  # Azure Configuration
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_USE_OIDC: true

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for comprehensive scanning
          persist-credentials: false

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@v3.95.5
        with:
          path: ./
          base: ${{ github.event.before || '' }}
          head: HEAD
          extra_args: --exclude-paths=.github/workflows/ci.yml,docker-compose.yml,.env.example --no-verification
        continue-on-error: true


  build-shared-packages:
    name: Build Shared Packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          run-prisma-generate: 'true'

      - name: Build shared packages
        run: |
          pnpm --filter @dculus/types build
          pnpm --filter @dculus/utils build
          pnpm --filter @dculus/ui build

      - name: Upload built packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-dist
          path: |
            packages/types/dist
            packages/utils/dist
            packages/ui/dist
          retention-days: 1

  lint-and-type-check:
    runs-on: ubuntu-latest
    needs: build-shared-packages
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          run-prisma-generate: 'true'

      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          name: packages-dist
          path: packages

      - name: Run linting
        run: pnpm lint

      - name: Run type checking
        run: pnpm type-check

      - name: Security audit
        run: pnpm audit --audit-level=high
        continue-on-error: true  # Don't block on audit warnings initially — review and fix separately

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: build-shared-packages
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          run-prisma-generate: 'true'

      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          name: packages-dist
          path: packages

      - name: Build backend
        run: pnpm --filter backend build

      - name: Upload backend dist
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist-${{ github.sha }}
          path: apps/backend/dist
          retention-days: 30

  unit-tests-backend:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    needs: build-shared-packages
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          run-prisma-generate: 'true'

      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          name: packages-dist
          path: packages

      - name: Run shared package unit tests
        run: |
          pnpm --filter @dculus/types test
          pnpm --filter @dculus/ui test

      - name: Run unit tests with coverage
        env:
          NODE_ENV: test
          BETTER_AUTH_SECRET: test-only-secret-for-unit-tests-not-used-in-production
          PUBLIC_S3_ENDPOINT: http://localhost:9000
          PUBLIC_S3_ACCESS_KEY: test-access-key
          PUBLIC_S3_SECRET_KEY: test-secret-key
          PUBLIC_S3_BUCKET_NAME: test-public-bucket
          PRIVATE_S3_BUCKET_NAME: test-private-bucket
          PUBLIC_S3_CDN_URL: http://localhost:9000
          CHARGEBEE_API_KEY: test-chargebee-key
          CHARGEBEE_SITE: test-site
          EMAIL_HOST: test-smtp
          EMAIL_USER: test-user
        run: pnpm --filter backend test:coverage

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [build-shared-packages, build-backend]
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          run-prisma-generate: 'true'

      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          name: packages-dist
          path: packages

      - name: Download backend dist
        uses: actions/download-artifact@v4
        with:
          name: backend-dist-${{ github.sha }}
          path: apps/backend/dist

      - name: Pre-pull integration PostgreSQL image
        run: docker compose -f test/integration/docker-compose.postgres.yml pull postgres

      - name: Start integration PostgreSQL
        run: docker compose -f test/integration/docker-compose.postgres.yml up -d postgres

      - name: Wait for integration PostgreSQL
        run: |
          for i in {1..30}; do
            if docker compose -f test/integration/docker-compose.postgres.yml exec -T postgres pg_isready -U dculus -d dculus_forms; then
              exit 0
            fi
            echo "Waiting for PostgreSQL (${i}/30)..."
            sleep 2
          done
          echo "PostgreSQL failed to become ready" >&2
          docker compose -f test/integration/docker-compose.postgres.yml logs postgres
          exit 1

      - name: Wait for host PostgreSQL port
        shell: bash
        run: |
          for i in {1..30}; do
            if (echo > /dev/tcp/127.0.0.1/5543) >/dev/null 2>&1; then
              echo "Host port 5543 is reachable"
              exit 0
            fi
            echo "Waiting for host port 5543 (${i}/30)..."
            sleep 2
          done
          echo "Host port 5543 never opened" >&2
          docker compose -f test/integration/docker-compose.postgres.yml logs postgres
          exit 1

      - name: Export integration database environment
        run: |
          echo "DATABASE_URL=postgresql://dculus:dculus_dev_password@127.0.0.1:5543/dculus_forms?sslmode=disable&gssencmode=disable" >> $GITHUB_ENV
          echo "DIRECT_URL=postgresql://dculus:dculus_dev_password@127.0.0.1:5543/dculus_forms?sslmode=disable&gssencmode=disable" >> $GITHUB_ENV
          echo "MANAGE_INTEGRATION_DOCKER=false" >> $GITHUB_ENV

      - name: Apply Prisma migrations to integration database
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          DIRECT_URL: ${{ env.DIRECT_URL }}
          BETTER_AUTH_SECRET: test-only-secret-for-integration-tests-not-used-in-production
          PUBLIC_S3_ENDPOINT: http://localhost:9000
          PUBLIC_S3_ACCESS_KEY: test-access-key
          PUBLIC_S3_SECRET_KEY: test-secret-key
          PUBLIC_S3_BUCKET_NAME: test-public-bucket
          PRIVATE_S3_BUCKET_NAME: test-private-bucket
          PUBLIC_S3_CDN_URL: http://localhost:9000
        run: pnpm --filter backend db:migrate:deploy

      - name: Run integration tests
        id: run_integration_tests
        env:
          NODE_ENV: test
          DATABASE_URL: ${{ env.DATABASE_URL }}
          DIRECT_URL: ${{ env.DIRECT_URL }}
          MANAGE_INTEGRATION_DOCKER: ${{ env.MANAGE_INTEGRATION_DOCKER }}
          # Phase 2 fix removed the BETTER_AUTH_SECRET fallback — integration tests
          # spin up the real backend server which requires this at startup.
          BETTER_AUTH_SECRET: test-only-secret-for-integration-tests-not-used-in-production
          BETTER_AUTH_URL: http://localhost:4000
          PUBLIC_S3_ENDPOINT: http://localhost:9000
          PUBLIC_S3_ACCESS_KEY: test-access-key
          PUBLIC_S3_SECRET_KEY: test-secret-key
          PUBLIC_S3_BUCKET_NAME: test-public-bucket
          PRIVATE_S3_BUCKET_NAME: test-private-bucket
          PUBLIC_S3_CDN_URL: http://localhost:9000
        run: pnpm test:integration

      - name: Stop integration PostgreSQL
        if: always()
        run: docker compose -f test/integration/docker-compose.postgres.yml down -v

      - name: Integration test summary
        if: always()
        run: |
          echo "## 🧪 Integration Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.run_integration_tests.outcome }}" = "success" ]; then
            echo "✅ All integration tests passed!" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Some integration tests failed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Test Infrastructure:**" >> $GITHUB_STEP_SUMMARY
          echo "- Dockerized PostgreSQL (test/integration/docker-compose.postgres.yml): ✅" >> $GITHUB_STEP_SUMMARY
          echo "- Mock SMTP Server: ✅" >> $GITHUB_STEP_SUMMARY
          echo "- Backend Server: ✅" >> $GITHUB_STEP_SUMMARY
          echo "- Prisma Schema: ✅" >> $GITHUB_STEP_SUMMARY

  build-form-app:
    name: Build Form App
    runs-on: ubuntu-latest
    needs: build-shared-packages
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          name: packages-dist
          path: packages

      # Environment values come from /config.js at deploy time, so one build serves every environment.
      - name: Build form-app
        run: pnpm --filter form-app build

      - name: Upload form-app dist
        uses: actions/upload-artifact@v4
        with:
          name: form-app-dist-${{ github.sha }}
          path: apps/form-app/dist
          retention-days: 30

  build-form-viewer:
    name: Build Form Viewer
    runs-on: ubuntu-latest
    needs: build-shared-packages
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          name: packages-dist
          path: packages

      - name: Run unit tests (form-viewer)
        run: pnpm --filter form-viewer test:unit

      - name: Build form-viewer
        run: pnpm --filter form-viewer build

      - name: Upload form-viewer dist
        uses: actions/upload-artifact@v4
        with:
          name: form-viewer-dist-${{ github.sha }}
          path: apps/form-viewer/dist
          retention-days: 30

  build-admin-app:
    name: Build Admin App
    runs-on: ubuntu-latest
    needs: build-shared-packages
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          name: packages-dist
          path: packages

      - name: Build admin-app
        run: pnpm --filter admin-app build

      - name: Upload admin-app dist
        uses: actions/upload-artifact@v4
        with:
          name: admin-app-dist-${{ github.sha }}
          path: apps/admin-app/dist
          retention-days: 30

  e2e-local:
    name: E2E Tests (Local Runner, ${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: [build-shared-packages, build-backend]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: '1of3'
            command: pnpm test:e2e --shard 1/3
          - shard: '2of3'
            command: pnpm test:e2e --shard 2/3
          - shard: '3of3'
            command: pnpm test:e2e --shard 3/3
          - shard: collab
            command: pnpm test:e2e:collab

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dculus
          POSTGRES_PASSWORD: dculus_dev_password
          POSTGRES_DB: dculus_forms_e2e
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - "5544:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://dculus:dculus_dev_password@localhost:5544/dculus_forms_e2e?sslmode=disable
      DIRECT_URL: postgresql://dculus:dculus_dev_password@localhost:5544/dculus_forms_e2e?sslmode=disable
      BETTER_AUTH_SECRET: e2e-test-secret-at-least-32-chars-long-ok
      BETTER_AUTH_URL: http://localhost:4000
      NODE_ENV: test
      # Stub S3 — no real uploads in local E2E
      PUBLIC_S3_ENDPOINT: http://localhost:9000
      PUBLIC_S3_ACCESS_KEY: test-key
      PUBLIC_S3_SECRET_KEY: test-secret
      PUBLIC_S3_BUCKET_NAME: test-public
      PRIVATE_S3_BUCKET_NAME: test-private
      PUBLIC_S3_CDN_URL: http://localhost:9000
      # E2E credentials
      E2E_EMAIL: e2e@dculus-ci.test
      E2E_PASSWORD: E2eCiTest123!
      E2E_FORM_APP_URL: http://localhost:3000
      E2E_FORM_VIEWER_URL: http://localhost:5173
      E2E_BACKEND_URL: http://localhost:4000
      E2E_HEADLESS: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          run-prisma-generate: 'true'

      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          name: packages-dist
          path: packages

      - name: Download backend dist
        uses: actions/download-artifact@v4
        with:
          name: backend-dist-${{ github.sha }}
          path: apps/backend/dist

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      # Three independent tracks — backend provisioning, frontend build+serve, and
      # Playwright browser install — don't depend on each other, only on the E2E run
      # below. Running them as backgrounded subshells in one step (rather than as
      # separate sequential steps) overlaps their wall-clock time instead of summing it.
      - name: Provision backend, build frontends, and install Playwright browsers (parallel)
        run: |
          set -e

          (
            set -e
            pnpm db:migrate:deploy

            cd apps/backend
            npx tsx src/scripts/seed-templates-ci.ts || echo "Template seeding done (errors OK)"
            npx tsx src/scripts/create-e2e-user.ts
            cd ../..

            PORT=4000 node apps/backend/dist/apps/backend/src/index.js &

            for i in {1..30}; do
              if curl -sf http://localhost:4000/health > /dev/null 2>&1; then
                echo "✅ Backend ready"
                exit 0
              fi
              echo "Waiting for backend (${i}/30)..."
              sleep 2
            done
            echo "❌ Backend failed to start" && exit 1
          ) &
          BACKEND_TRACK=$!

          (
            set -e
            (
              VITE_API_URL=http://localhost:4000 \
              VITE_GRAPHQL_URL=http://localhost:4000/graphql \
              VITE_FORM_VIEWER_URL=http://localhost:5173 \
              pnpm --filter form-app build
            ) &
            FORM_APP_PID=$!

            (
              VITE_API_URL=http://localhost:4000 \
              VITE_GRAPHQL_URL=http://localhost:4000/graphql \
              pnpm --filter form-viewer build
            ) &
            FORM_VIEWER_PID=$!

            wait $FORM_APP_PID
            wait $FORM_VIEWER_PID

            pnpm --filter form-app preview --port 3000 --host &
            pnpm --filter form-viewer preview --port 5173 --host &

            for i in {1..30}; do
              FA=$(curl -sf http://localhost:3000 > /dev/null 2>&1 && echo ok || echo -)
              FV=$(curl -sf http://localhost:5173 > /dev/null 2>&1 && echo ok || echo -)
              [ "$FA" = "ok" ] && [ "$FV" = "ok" ] && echo "✅ Both frontends ready" && exit 0
              echo "Waiting for frontends form-app=$FA viewer=$FV (${i}/30)..."
              sleep 3
            done
            echo "❌ Frontends failed to start" && exit 1
          ) &
          FRONTEND_TRACK=$!

          (
            set -e
            pnpm exec playwright install chromium --with-deps
          ) &
          PLAYWRIGHT_TRACK=$!

          wait $BACKEND_TRACK
          wait $FRONTEND_TRACK
          wait $PLAYWRIGHT_TRACK

      - name: Run E2E tests (${{ matrix.shard }})
        run: ${{ matrix.command }}

      - name: Upload E2E screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-local-screenshots-${{ matrix.shard }}
          path: test-results/e2e/screenshots/
          if-no-files-found: ignore

  build-and-push:
    needs: [lint-and-type-check, build-backend, unit-tests-backend, integration-tests]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      pull-requests: write
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Semantic versioning for tags (e.g., v1.2.3 -> v1.2.3, v1.2, v1)
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            # Branch-based tags (e.g., main, develop)
            type=ref,event=branch
            type=ref,event=pr
            # Full SHA tag for automation reliability (e.g., sha-<full_sha>)
            type=sha,format=long
            # Latest tag for default branch
            type=raw,value=latest,enable={{is_default_branch}}
            # Custom tag from workflow_dispatch
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=Dculus Forms Backend
            org.opencontainers.image.description=Express.js + GraphQL backend for Dculus Forms with MongoDB and collaborative editing
            org.opencontainers.image.vendor=Dculus Industries
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Display Docker tags
        run: |
          echo "## 🏷️ Docker Image Tags" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The following tags will be applied to the Docker image:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "📌 **Version Release Detected**: v$VERSION" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Docker Pull Commands**:" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "# Pull specific version" >> $GITHUB_STEP_SUMMARY
            echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$VERSION" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "# Or pull latest" >> $GITHUB_STEP_SUMMARY
            echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1


      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          echo "## 🚀 Docker Hub Deployment Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image**: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "**Platforms**: linux/amd64, linux/arm64" >> $GITHUB_STEP_SUMMARY
          echo "**Size**: $(docker images ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest --format 'table {{.Size}}' | tail -1)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Quick Deploy Commands:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "docker run -d -p 4000:4000 --name dculus-backend \\" >> $GITHUB_STEP_SUMMARY
          echo "  -e DATABASE_URL='your-db-url' \\" >> $GITHUB_STEP_SUMMARY
          echo "  -e BETTER_AUTH_SECRET='your-auth-secret' \\" >> $GITHUB_STEP_SUMMARY
          echo "  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # Deploys the image built above (sha-<commit>) to dev. Production is promoted
  # from this same image by release.yml.
  deploy-dev:
    name: Deploy to Dev
    needs:
      - security-scan
      - lint-and-type-check
      - build-backend
      - unit-tests-backend
      - integration-tests
      - build-form-app
      - build-form-viewer
      - build-admin-app
      - e2e-local
      - build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/multi-cloud-deployment.yml
    secrets: inherit
    with:
      environment: dev
      release_tag: sha-${{ github.sha }}
      release_commit: ${{ github.sha }}

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [security-scan, build-shared-packages, lint-and-type-check, build-backend, unit-tests-backend, integration-tests, build-and-push, e2e-local]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Generate build summary
        run: |
          echo "## 🚀 Build Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security-scan.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Shared Packages | ${{ needs.build-shared-packages.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint & Type Check | ${{ needs.lint-and-type-check.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Build | ${{ needs.build-backend.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Unit Tests | ${{ needs.unit-tests-backend.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | ${{ needs.integration-tests.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Tests (Local) | ${{ needs.e2e-local.result == 'success' && '✅' || needs.e2e-local.result == 'skipped' && '⏭️' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Build & Push | ${{ needs.build-and-push.result == 'success' && '✅' || needs.build-and-push.result == 'skipped' && '⏭️ Skipped (main only)' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.build-and-push.result }}" == "success" ]]; then
            echo "### 🐳 Docker Image Built" >> $GITHUB_STEP_SUMMARY
            echo "✅ Backend Docker image built and pushed to Docker Hub" >> $GITHUB_STEP_SUMMARY
            echo "📦 Deployed to dev via multi-cloud-deployment.yml; promote to production with the Release workflow" >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ needs.build-and-push.result }}" == "skipped" ]]; then
            echo "### ℹ️ Docker Build Skipped" >> $GITHUB_STEP_SUMMARY
            echo "Docker images are only built on the main branch" >> $GITHUB_STEP_SUMMARY
          fi
